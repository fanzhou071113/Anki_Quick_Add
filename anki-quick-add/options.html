<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Anki Quick Add 设置</title><link rel="stylesheet" href="options.css"></head>
<body><main><h1>Anki Quick Add</h1><p class="intro">选中文字后右键“添加到 Anki”。API 关闭时会直接添加原文。</p>
<section aria-labelledby="anki-heading"><h2 id="anki-heading">Anki</h2><label for="anki-url">AnkiConnect URL</label><input id="anki-url" type="url" value="http://127.0.0.1:8765" spellcheck="false">
<label for="deck">目标卡组</label><div class="row"><input id="deck" list="decks" placeholder="例如：Deutsch"><datalist id="decks"></datalist><button id="refresh-decks" type="button">刷新</button></div>
<label for="model">Note Type</label><div class="row"><input id="model" list="models" placeholder="例如：Basic"><datalist id="models"></datalist><button id="refresh-models" type="button">刷新</button></div>
<label for="original-field">Original Text Field</label><div class="row"><input id="original-field" list="fields" placeholder="例如：Front"><button id="refresh-fields" type="button">刷新字段</button></div>
<label for="instruction-field">Instruction Field</label><input id="instruction-field" list="fields" placeholder="例如：Category"><datalist id="fields"></datalist></section>
<section aria-labelledby="api-heading"><h2 id="api-heading">External API</h2><label class="check"><input id="api-enabled" type="checkbox"> 启用 External API</label>
<label for="api-provider">API Provider</label><select id="api-provider"><option value="openai">OpenAI-compatible</option><option value="ollama">Ollama Native</option></select><label for="api-endpoint">API Server / Endpoint</label><input id="api-endpoint" type="url" placeholder="http://100.75.97.86:8799"><label for="api-model">Model</label><div class="row"><input id="api-model" list="api-models" placeholder="填写实际模型名称"><datalist id="api-models"></datalist><button id="refresh-api-models" type="button">Refresh</button></div>
<label for="api-key">API Key</label><div class="row"><input id="api-key" type="password" autocomplete="new-password" placeholder="留空保持已保存的密钥"><button id="clear-key" type="button">清除密钥</button></div>
<label for="prompt">Prompt <span class="help">支持 {{text}} 代表选中文字</span></label><textarea id="prompt" rows="5" placeholder="例如：判断 {{text}} 的词性，只返回分类名称。"></textarea>
<p class="hint">填写服务器根地址即可。程序会按 Provider 生成 Chat route；Model 可刷新或手动输入。API Key 仅保存在本机。HTTP 支持本机、局域网和 Tailscale 地址。</p>
<div class="row diagnostics-actions"><button id="test-connection" type="button">Test Connection</button><button id="test-flow" type="button">Test Full Flow</button></div>
<div id="diagnostics" class="diagnostics" aria-live="polite" hidden><h3 id="diagnostic-title">诊断结果</h3><ol id="diagnostic-steps"></ol><details><summary>Raw API Response</summary><pre id="raw-response"></pre></details><details id="mapped-fields-wrap" hidden><summary>生成的 Anki 字段（不会创建笔记）</summary><pre id="mapped-fields"></pre></details><details><summary>Debug Log（不含 API Key、Prompt 或正文）</summary><pre id="debug-log"></pre></details></div></section>
<button id="save" class="primary" type="button">保存设置</button><p id="status" role="status" aria-live="polite"></p></main>
<script src="external-api/network-policy.js"></script><script src="external-api/provider-routing.js"></script><script src="external-api/debug-log.js"></script><script src="external-api/prompt.js"></script><script src="external-api/response-parser.js"></script><script src="external-api/api-client.js"></script><script src="external-api/anki-mapping.js"></script><script src="external-api/diagnostics.js"></script><script src="options.js"></script></body></html>
